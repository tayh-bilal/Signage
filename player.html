<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zero-Blink Precision Player</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: black; cursor: none; }
        video { width: 100%; height: 100%; object-fit: fill; display: block; background: black; }
        
        #idle-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0f0; font-family: 'Courier New', monospace; background: black; z-index: 500;
            display: none; 
            text-align: center;
        }
        #idle-time { font-size: 120px; font-weight: bold; margin-bottom: 5px; }
        #idle-ms { font-size: 50px; margin-bottom: 50px; opacity: 0.8; }
        #idle-id { font-size: 32px; border: 3px solid #0f0; padding: 20px 50px; border-radius: 15px; letter-spacing: 3px; font-weight: bold; }

        #sync-ui {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #0f0; 
            background: rgba(0,0,0,0.9); padding: 15px 30px; font-family: monospace;
            border-radius: 8px; display: none; z-index: 1000; font-size: 24px; border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="idle-ui">
        <div id="idle-time">00:00:00</div>
        <div id="idle-ms">.000</div>
        <div id="idle-id">SCREEN ID: INITIALIZING...</div>
    </div>
    <div id="sync-ui"></div>
    <video id="videoPlayer" autoplay></video>

<script>
    const fs = require('fs');
    const path = require('path');
    const https = require('https');
    const os = require('os');
    const { ipcRenderer } = require('electron');

    // --- APP VERSION INFO ---
    const versionArg = process.argv.find(arg => arg.startsWith('--appVersion='));
    const currentAppVersion = versionArg ? versionArg.split('=')[1] : '0.0.0';
    let updateTriggered = false;

    // --- CONFIG ---
    const isPackaged = !process.defaultApp;
    const baseDir = isPackaged ? path.join(process.env.APPDATA, 'ZeroBlinkPlayer') : __dirname;
    const localFolder = path.join(baseDir, 'videos');
    if (!fs.existsSync(localFolder)) fs.mkdirSync(localFolder, { recursive: true });

    const video = document.getElementById('videoPlayer');
    const idleUi = document.getElementById('idle-ui');
    const idleTimeTxt = document.getElementById('idle-time');
    const idleMsTxt = document.getElementById('idle-ms');
    const idleIdTxt = document.getElementById('idle-id');
    const syncUi = document.getElementById('sync-ui');
    
    const configPath = path.join(baseDir, 'screen-config.json');
    const playlistCachePath = path.join(baseDir, 'last_playlist.json');
    const offsetFile = path.join(baseDir, 'time_offset.txt');

    let videos = [];
    let timeOffset = 0;
    let watchdogTimer = null;
    let screenId = null;
    let clockInterval = null;

    // Load Sync Offset
    if (fs.existsSync(offsetFile)) {
        try { timeOffset = parseFloat(fs.readFileSync(offsetFile, 'utf8')) || 0; } catch(e) {}
    }

    // --- 1. INITIALIZATION & ID CHECK ---
    function getValidId() {
        try {
            if (fs.existsSync(configPath)) {
                let data = JSON.parse(fs.readFileSync(configPath, 'utf8'));
                if (data.screenId && data.screenId !== '000000000000') {
                    return data.screenId;
                }
            }
        } catch (e) { console.log("No valid config found."); }

        const interfaces = os.networkInterfaces();
        for (let name in interfaces) {
            for (let iface of interfaces[name]) {
                if (!iface.internal && iface.mac && iface.mac !== '00:00:00:00:00:00') {
                    const newId = iface.mac.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
                    fs.writeFileSync(configPath, JSON.stringify({ screenId: newId }));
                    return newId;
                }
            }
        }
        return null;
    }

    function startApp() {
        screenId = getValidId();

        if (!screenId) {
            showNetworkError();
            setTimeout(startApp, 5000); 
            return;
        }

        restoreNormalUi();
        idleIdTxt.innerText = `SCREEN ID: ${screenId}`;
        bootstrap();
    }

    // --- UI STATES ---
    function showNetworkError() {
        clearInterval(clockInterval); 
        idleUi.style.display = 'flex';
        video.style.display = 'none';
        video.src = "";
        
        idleTimeTxt.innerText = "NO CONNECTION";
        idleTimeTxt.style.color = "#ff0000"; 
        idleMsTxt.innerText = "";
        
        idleIdTxt.innerText = "PLEASE CONNECT CABLE OR WI-FI";
        idleIdTxt.style.color = "#ff0000";
        idleIdTxt.style.borderColor = "#ff0000";
    }

    function showUnregisteredError() {
        clearInterval(clockInterval); 
        idleUi.style.display = 'flex';
        video.style.display = 'none';
        video.src = "";
        
        idleTimeTxt.innerText = "UNREGISTERED";
        idleTimeTxt.style.color = "#ff9900"; 
        idleMsTxt.innerText = "";
        
        // Show the MAC Address instead of the error message
        idleIdTxt.innerText = `ID: ${screenId}`; 
        idleIdTxt.style.color = "#ff9900";
        idleIdTxt.style.borderColor = "#ff9900";
    }

    function restoreNormalUi() {
        idleTimeTxt.style.color = "#0f0"; 
        idleIdTxt.style.color = "#0f0";
        idleIdTxt.style.borderColor = "#0f0";
        
        clearInterval(clockInterval);
        clockInterval = setInterval(() => {
            const now = new Date(Date.now() + (timeOffset * 1000));
            idleTimeTxt.innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
            idleMsTxt.innerText = `.${String(now.getMilliseconds()).padStart(3,'0')}`;
        }, 16);
    }

    // --- 2. BOOTSTRAP: Load from Disk ---
    function bootstrap() {
        try {
            if (fs.existsSync(playlistCachePath)) {
                const cached = JSON.parse(fs.readFileSync(playlistCachePath, 'utf8'));
                if (Array.isArray(cached) && cached.length > 0) {
                    videos = cached;
                    console.log("Loaded cached playlist.");
                }
            }
        } catch (e) { console.error("Cache read error:", e); }
        
        playSync(true); 
        syncVideos();   
    }

    // --- 3. PLAYBACK ENGINE ---
    async function playSync(forceJump = false) {
        if (!videos || videos.length === 0) {
            if (idleTimeTxt.innerText !== "UNREGISTERED" && idleTimeTxt.innerText !== "NO CONNECTION") {
                idleUi.style.display = 'flex';
                video.style.display = 'none';
            }
            return;
        }

        const status = getSyncStatus();
        if (!status) return;

        const filePath = path.join(localFolder, status.file);

        if (!fs.existsSync(filePath)) {
            setTimeout(() => playSync(true), 5000);
            return;
        }

        idleUi.style.display = 'none';
        video.style.display = 'block';

        const currentFile = video.src ? decodeURI(video.src).split(/[\\/]/).pop() : null;

        if (currentFile !== status.file || forceJump) {
            video.src = `file://${filePath}`; 
            video.onloadedmetadata = () => {
                video.currentTime = status.seek;
                video.play().catch(e => console.error("Playback failed:", e));
                scheduleNext(video.duration - status.seek);
            };
        } else {
            const drift = Math.abs(video.currentTime - status.seek);
            if (drift > 0.15) video.currentTime = status.seek;
            scheduleNext(video.duration - video.currentTime);
        }
    }

    function getSyncStatus() {
        const totalDuration = videos.reduce((acc, v) => acc + (v.duration || 0), 0);
        if (totalDuration === 0) return { index: 0, seek: 0, file: videos[0].file };

        const now = (Date.now() / 1000) + timeOffset;
        const globalPos = now % totalDuration;
        
        let elapsed = 0;
        for (let i = 0; i < videos.length; i++) {
            if (elapsed + videos[i].duration > globalPos) {
                return { index: i, seek: globalPos - elapsed, file: videos[i].file };
            }
            elapsed += videos[i].duration;
        }
        return { index: 0, seek: 0, file: videos[0].file };
    }

    function scheduleNext(remain) {
        clearTimeout(watchdogTimer);
        const delay = Math.max(10, (remain * 1000) - 50);
        watchdogTimer = setTimeout(() => playSync(), delay);
    }

    // --- 4. HARDENED SYNC (With Auto-Update) ---
    async function syncVideos() {
        try {
            const res = await fetch(`https://itguodvoatxhbibfvjch.supabase.co/functions/v1/playlist?screenId=${screenId}`);
            
            // Try to parse the JSON first, regardless of the HTTP status code
            let data = {};
            try { data = await res.json(); } catch(e) {}
            
            // 🛑 Handle "Screen not found"
            if (data && data.error) {
                console.warn("Screen is unregistered:", data.error);
                videos = []; // Empty the memory playlist
                try { fs.unlinkSync(playlistCachePath); } catch(e) {} // Delete saved playlist
                showUnregisteredError(); // Show ORANGE screen with MAC Address
                return; // Stop sync completely
            }

            if (!res.ok) throw new Error("Server error HTTP " + res.status);

            // If we recovered from being unregistered, ensure text is green again
            if (idleTimeTxt.innerText === "UNREGISTERED") restoreNormalUi();

            // ⚡ AUTO-UPDATE CHECK ⚡
            if (data.version) {
                const remoteVer = data.version.replace('v', '');
                const localVer = currentAppVersion.replace('v', '');
                if (remoteVer !== localVer && !updateTriggered) {
                    console.log(`Update detected: ${remoteVer}`);
                    updateTriggered = true; 
                    ipcRenderer.send('trigger-update');
                }
            }

            const newList = data.videos || [];

            if (newList.length > 0) {
                for (let v of newList) {
                    const dest = path.join(localFolder, v.file);
                    if (!fs.existsSync(dest)) {
                        await downloadFile(v.url, dest);
                    }
                    v.duration = await getVideoDuration(dest);
                }
                
                videos = newList;
                fs.writeFileSync(playlistCachePath, JSON.stringify(videos));
                playSync(); 
            }
        } catch (err) {
            console.log("Sync skipped (Offline or Server Error):", err.message);
        } finally {
            setTimeout(syncVideos, 60000); 
        }
    }

    // --- UTILITIES ---
    function downloadFile(url, dest) {
        return new Promise((resolve) => {
            const file = fs.createWriteStream(dest);
            https.get(url, res => {
                res.pipe(file);
                file.on('finish', () => { file.close(); resolve(); });
            }).on('error', () => { resolve(); });
        });
    }

    function getVideoDuration(filePath) {
        return new Promise(resolve => {
            const temp = document.createElement('video');
            temp.src = `file://${filePath}`;
            temp.onloadedmetadata = () => {
                const d = temp.duration;
                temp.src = ""; temp.remove();
                resolve(d);
            };
            temp.onerror = () => { temp.remove(); resolve(10); };
        });
    }

    // --- CONTROLS ---
    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') { timeOffset += 0.01; saveOffset(); }
        if (e.key === 'ArrowLeft') { timeOffset -= 0.01; saveOffset(); }
    });

    function saveOffset() {
        try { fs.writeFileSync(offsetFile, timeOffset.toString()); } catch(e) {}
        syncUi.innerText = `OFFSET: ${timeOffset > 0 ? '+' : ''}${timeOffset.toFixed(2)}s`;
        syncUi.style.display = 'block';
        clearTimeout(window.uiTimer);
        window.uiTimer = setTimeout(() => syncUi.style.display = 'none', 3000);
        if (videos.length) playSync(true); 
    }

    // Emergency Watchdog
    setInterval(() => {
        if (videos.length > 0 && (video.paused || video.readyState < 2)) {
            console.log("Watchdog restarting video...");
            playSync(true);
        }
    }, 5000);

    // KICK OFF THE APP
    startApp();
</script>
</body>
</html>
