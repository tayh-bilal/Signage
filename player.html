<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Zero-Blink Precision Player</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: black; cursor: none; }
        video { width: 100%; height: 100%; object-fit: fill; display: block; background: black; }
        
        #idle-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #0f0; font-family: 'Courier New', monospace; background: black; z-index: 500;
            display: none; 
        }
        #idle-time { font-size: 120px; font-weight: bold; margin-bottom: 5px; }
        #idle-ms { font-size: 50px; margin-bottom: 50px; opacity: 0.8; }
        #idle-id { font-size: 32px; border: 3px solid #0f0; padding: 20px 50px; border-radius: 15px; letter-spacing: 3px; font-weight: bold; }

        #sync-ui {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); color: #0f0; 
            background: rgba(0,0,0,0.9); padding: 15px 30px; font-family: monospace;
            border-radius: 8px; display: none; z-index: 1000; font-size: 24px; border: 1px solid #0f0;
        }
    </style>
</head>
<body>
    <div id="idle-ui">
        <div id="idle-time">00:00:00</div>
        <div id="idle-ms">.000</div>
        <div id="idle-id">SCREEN ID: INITIALIZING...</div>
    </div>
    <div id="sync-ui"></div>
    <video id="videoPlayer" autoplay></video>

<script>
    const fs = require('fs');
    const path = require('path');
    const https = require('https');
    const os = require('os');
    const { ipcRenderer } = require('electron');

    // --- CONFIGURATION ---
    const LOG_URL = "https://itguodvoatxhbibfvjch.supabase.co/functions/v1/log-playback";
    const versionArg = process.argv.find(arg => arg.startsWith('--appVersion='));
    const currentAppVersion = versionArg ? versionArg.split('=')[1] : '0.0.0';

    const isPackaged = !process.defaultApp;
    const baseDir = isPackaged ? path.join(process.env.APPDATA, 'ZeroBlinkPlayer') : __dirname;
    if (!fs.existsSync(baseDir)) fs.mkdirSync(baseDir, { recursive: true });

    const video = document.getElementById('videoPlayer');
    const idleUi = document.getElementById('idle-ui');
    const idleTimeTxt = document.getElementById('idle-time');
    const idleMsTxt = document.getElementById('idle-ms');
    const idleIdTxt = document.getElementById('idle-id');
    const syncUi = document.getElementById('sync-ui');
    
    const localFolder = path.join(baseDir, 'videos'); 
    if (!fs.existsSync(localFolder)) fs.mkdirSync(localFolder, { recursive: true }); 

    // --- STATE ---
    let videos = [];
    let lastPlaybackId = null;
    let timeOffset = 0;
    let watchdogTimer = null;
    let syncInterval = null;
    let updateTriggered = false;

    // --- PERSISTENCE: LOAD LAST KNOWN PLAYLIST ---
    const playlistCachePath = path.join(baseDir, 'last_playlist.json');
    if (fs.existsSync(playlistCachePath)) {
        try { 
            videos = JSON.parse(fs.readFileSync(playlistCachePath, 'utf8'));
            console.log("Loaded cached playlist from disk.");
        } catch(e) { videos = []; }
    }

    // --- ID LOGIC ---
    const configPath = path.join(baseDir, 'screen-config.json');
    let screenId = "default";
    try {
        if (fs.existsSync(configPath)) {
            screenId = JSON.parse(fs.readFileSync(configPath, 'utf8')).screenId;
        } else {
            screenId = os.networkInterfaces().eth0?.[0].mac.replace(/:/g,'') || "DEFAULT";
            fs.writeFileSync(configPath, JSON.stringify({ screenId }));
        }
    } catch(e) { screenId = "ERR"; }
    idleIdTxt.innerText = `SCREEN ID: ${screenId}`;

    // --- CLOCK UPDATE ---
    setInterval(() => {
        const now = new Date(Date.now() + (timeOffset * 1000));
        idleTimeTxt.innerText = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
        idleMsTxt.innerText = `.${String(now.getMilliseconds()).padStart(3,'0')}`;
    }, 16);

    // --- SYNC ENGINE ---
    function getSyncStatus() {
        if (!videos.length) return null;
        const totalDuration = videos.reduce((acc, v) => acc + (v.duration || 0), 0);
        if (totalDuration === 0) return { index: 0, seek: 0, file: videos[0].file, instanceId: "init" };

        const now = (Date.now() / 1000) + timeOffset; 
        const loopCount = Math.floor(now / totalDuration);
        const globalPos = now % totalDuration;
        
        let elapsed = 0;
        for (let i = 0; i < videos.length; i++) {
            if (elapsed + videos[i].duration > globalPos) {
                return { 
                    index: i, 
                    seek: globalPos - elapsed, 
                    file: videos[i].file,
                    instanceId: `${loopCount}-${i}` 
                };
            }
            elapsed += videos[i].duration;
        }
        return { index: 0, seek: 0, file: videos[0].file, instanceId: `${loopCount}-0` };
    }

    async function playSync(forceJump = false) {
        if (!videos.length) {
            idleUi.style.display = 'flex'; 
            video.src = "";
            return;
        }
        
        const status = getSyncStatus();
        if (!status) return;

        idleUi.style.display = 'none';

        if (status.instanceId !== lastPlaybackId) {
            logPlayback(status.file);
            lastPlaybackId = status.instanceId;
        }

        const filePath = path.join(localFolder, status.file);
        const currentFile = video.src ? decodeURI(video.src).split(/[\\/]/).pop() : null;
        
        if (currentFile !== status.file || forceJump) {
            video.src = filePath;
            video.onloadedmetadata = () => {
                video.currentTime = status.seek;
                video.play().catch(()=>{});
                scheduleNext(video.duration - status.seek);
            };
        } else {
            const drift = Math.abs(video.currentTime - status.seek);
            if (drift > 0.1) video.currentTime = status.seek; 
            scheduleNext(video.duration - video.currentTime);
        }
    }

    function scheduleNext(remain) {
        clearTimeout(watchdogTimer);
        watchdogTimer = setTimeout(() => playSync(), (remain * 1000) - 50); 
    }

    // --- HARDENED SYNC (OFFLINE PROOF) ---
    async function syncVideos() {
        console.log("Checking for updates...");
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

            const res = await fetch(`https://itguodvoatxhbibfvjch.supabase.co/functions/v1/playlist?screenId=${screenId}`, { signal: controller.signal });
            clearTimeout(timeoutId);

            if (!res.ok) throw new Error("Server Response Error");
            const data = await res.json(); 

            // Version Check
            if (data.version && !updateTriggered) {
                if (data.version.replace('v','') !== currentAppVersion.replace('v','')) {
                    updateTriggered = true;
                    ipcRenderer.send('trigger-update');
                }
            }

            const newList = data.videos || []; 
            if (newList.length > 0) {
                // Download new files
                for (let v of newList) {
                    const dest = path.join(localFolder, v.file);
                    if (!fs.existsSync(dest)) {
                        await new Promise(r => {
                            const f = fs.createWriteStream(dest);
                            https.get(v.url, res => { res.pipe(f); f.on('finish', () => { f.close(); r(); }); }).on('error', r);
                        });
                    }
                    // Fix Memory Leak: Clean up temp video elements
                    v.duration = await new Promise(resolve => {
                        const temp = document.createElement('video');
                        temp.src = dest;
                        temp.onloadedmetadata = () => {
                            const d = temp.duration;
                            temp.src = ""; temp.load(); temp.remove();
                            resolve(d);
                        };
                        temp.onerror = () => { temp.remove(); resolve(10); };
                    });
                }
                
                // Only update memory and disk if we successfully processed the new list
                videos = newList;
                fs.writeFileSync(playlistCachePath, JSON.stringify(videos));
                playSync();
            }
        } catch (err) {
            console.warn("Sync failed (Network Offline?). Using last seen playlist.", err);
        } finally {
            startPolling(60000);
        }
    }

    function startPolling(ms) {
        if (window.currentPollRate === ms) return;
        clearInterval(syncInterval);
        window.currentPollRate = ms;
        syncInterval = setInterval(syncVideos, ms);
    }

    // --- EMERGENCY RECOVERY ---
    // If the video stalls or errors out, force a jump to current sync position
    video.onerror = () => { console.error("Video Error. Recovering..."); playSync(true); };
    
    // Safety Watchdog: Every 10s, if video is stuck and we have videos, kick it.
    setInterval(() => {
        if (videos.length > 0 && (video.paused || video.ended)) {
            console.log("Watchdog: Video was stuck. Restarting...");
            playSync(true);
        }
    }, 10000);

    // Initial Start
    syncVideos();
    if (videos.length > 0) playSync(); // Play immediate if cached
</script>

</body>
</html>
